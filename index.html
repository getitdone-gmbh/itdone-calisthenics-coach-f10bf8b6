<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalisthenicsCoach – Dein persönlicher Trainingsplan</title>
  <meta name="description" content="Wähle deine Calisthenics-Zieldisziplin, mach einen kurzen Formcheck und bekomme einen 8-Wochen-Trainingsplan, der zu deinem Level passt.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">CalisthenicsCoach</div>
    <p class="tagline">Ziel wählen, Form einschätzen, Plan bekommen.</p>
  </header>

  <main>
    <section id="step-discipline" class="step active">
      <h1>Welche Disziplin willst du lernen?</h1>
      <p class="lead">Wähle dein Ziel aus – der Plan wird auf deine aktuelle Form zugeschnitten.</p>
      <div class="discipline-grid" id="disciplineGrid"></div>
    </section>

    <section id="step-assessment" class="step">
      <button class="back-btn" data-back="discipline" type="button">← Andere Disziplin wählen</button>
      <h1 id="assessmentTitle"></h1>
      <p class="lead" id="assessmentIntro"></p>
      <form id="assessmentForm"></form>
    </section>

    <section id="step-plan" class="step">
      <button class="back-btn no-print" data-back="assessment" type="button">← Angaben ändern</button>
      <div class="plan-header">
        <h1 id="planTitle"></h1>
        <span class="level-badge" id="planLevelBadge"></span>
        <p class="lead" id="planIntro"></p>
      </div>
      <div id="planWeeks"></div>
      <div class="plan-actions no-print">
        <button id="printPlanBtn" class="primary-btn" type="button">Plan drucken / als PDF speichern</button>
        <button id="restartBtn" class="ghost-btn" type="button">Neue Disziplin wählen</button>
      </div>
    </section>
  </main>

  <footer class="site-footer no-print">
    <p>CalisthenicsCoach berechnet deinen Plan direkt in deinem Browser – deine Angaben werden nicht gespeichert.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
